<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizFill</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --p700:#6b21a8; --p600:#7c3aed; --p500:#8b5cf6;
        --p400:#a78bfa; --p300:#c4b5fd;
        --o500:#f97316; --o400:#fb923c; --o200:#fed7aa;
        --bg:#0f0a1a;   --s1:#1a1030;  --s2:#251843; --s3:#2f2060;
        --bd:#3d2b7a;   --bdd:#2a1f55;
        --tx:#f1eeff;   --txm:#a89ec4; --txd:#6b5f8a;
        --ok:#22c55e;   --warn:#f59e0b; --err:#ef4444;
        --font:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
        --r:8px; --rl:12px; --tx-dur:0.15s ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 360px;
        font-family: var(--font);
        font-size: 14px;
        color: var(--tx);
        background: var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ────────────────────────────────────────────────────── */
      .header {
        display: flex; align-items: center; gap: 10px;
        padding: 13px 14px 11px;
        background: linear-gradient(135deg,#3b0764,#6b21a8);
        border-top: 3px solid var(--o500);
      }
      .logo-wrap {
        width:32px; height:32px; border-radius:8px;
        background:rgba(255,255,255,.08);
        display:flex; align-items:center; justify-content:center; flex-shrink:0;
      }
      .header-text h1 { font-size:17px; font-weight:700; color:#fff; letter-spacing:-.2px; }
      .header-text p  { font-size:11px; color:rgba(255,255,255,.6); margin-top:1px; }
      .header-actions { margin-left:auto; display:flex; gap:6px; }
      .icon-btn {
        background:rgba(255,255,255,.1); border:none; border-radius:6px;
        color:rgba(255,255,255,.8); cursor:pointer; padding:5px 7px;
        display:flex; align-items:center; transition:background var(--tx-dur);
      }
      .icon-btn:hover { background:rgba(255,255,255,.2); color:#fff; }

      /* ── Content wrapper ───────────────────────────────────────────── */
      .content { padding:14px 14px 16px; }

      /* ── No-key banner ─────────────────────────────────────────────── */
      #no-key-banner {
        display:none;
        background:rgba(249,115,22,.1); border:1px solid rgba(249,115,22,.35);
        border-radius:var(--r); padding:10px 12px; margin-bottom:12px;
        font-size:12px; color:#fed7aa; line-height:1.5;
      }
      #no-key-banner a { color:var(--o400); font-weight:600; text-decoration:underline; cursor:pointer; }

      /* ── Fill button ───────────────────────────────────────────────── */
      #fill-btn {
        width:100%; padding:11px 0;
        background:linear-gradient(135deg,var(--p700),var(--p600));
        color:#fff; border:none; border-radius:var(--r);
        font-family:var(--font); font-size:14px; font-weight:600; cursor:pointer;
        display:flex; align-items:center; justify-content:center; gap:7px;
        box-shadow:0 2px 12px rgba(107,33,168,.5);
        transition:opacity var(--tx-dur),transform var(--tx-dur),box-shadow var(--tx-dur);
      }
      #fill-btn:hover:not(:disabled) { opacity:.88; box-shadow:0 4px 18px rgba(107,33,168,.65); }
      #fill-btn:active:not(:disabled) { transform:scale(.97); }
      #fill-btn:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }

      /* ── Status / spinner ──────────────────────────────────────────── */
      #status-area {
        display:none; align-items:center; gap:9px;
        margin-top:12px; font-size:12px; color:var(--p300);
      }
      .spinner {
        width:16px; height:16px; flex-shrink:0;
        border:2px solid var(--s3); border-top-color:var(--p500);
        border-radius:50%; animation:spin .65s linear infinite;
      }
      @keyframes spin { to { transform:rotate(360deg); } }

      /* ── Results card ──────────────────────────────────────────────── */
      #results-area { display:none; margin-top:12px; }
      .results-card {
        background:var(--s1); border:1px solid var(--bd);
        border-radius:var(--rl); overflow:hidden;
      }
      .results-title {
        display:flex; align-items:center; gap:7px;
        padding:10px 14px 8px; border-bottom:1px solid var(--bdd);
        font-size:12px; font-weight:600; color:var(--p300);
      }
      .conf-row { display:flex; padding:10px 14px; gap:8px; }
      .conf-cell {
        flex:1; background:var(--s2); border-radius:6px;
        padding:8px 6px; text-align:center;
      }
      .conf-cell .num { font-size:20px; font-weight:700; line-height:1; margin-bottom:3px; }
      .conf-cell .lbl { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; opacity:.75; }
      .conf-high .num, .conf-high .lbl { color:#86efac; }
      .conf-med  .num, .conf-med  .lbl { color:#fcd34d; }
      .conf-low  .num, .conf-low  .lbl { color:#fca5a5; }
      .results-footer { padding:7px 14px 10px; font-size:11px; color:var(--txd); text-align:right; }

      /* ── Error area ────────────────────────────────────────────────── */
      #error-area {
        display:none; margin-top:10px;
        background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3);
        border-radius:var(--r); padding:10px 12px;
        font-size:12px; color:#fca5a5; line-height:1.5;
      }

      /* ── Divider ───────────────────────────────────────────────────── */
      .divider { height:1px; background:var(--bdd); margin:13px 0; }

      /* ── Resources section ─────────────────────────────────────────── */
      .res-header {
        display:flex; align-items:center; justify-content:space-between;
        margin-bottom:10px;
      }
      .section-label {
        font-size:10px; font-weight:700; letter-spacing:.08em;
        text-transform:uppercase; color:var(--p400);
      }
      .section-label span { color:var(--o400); }

      /* Tab bar */
      .res-tabs {
        display:flex; gap:2px; margin-bottom:10px;
        background:var(--s1); border-radius:var(--r);
        padding:3px; border:1px solid var(--bd);
      }
      .res-tab {
        flex:1; padding:5px 0; font-size:11px; font-weight:600;
        font-family:var(--font); background:transparent; border:none;
        border-radius:6px; color:var(--txm); cursor:pointer;
        transition:background var(--tx-dur), color var(--tx-dur);
      }
      .res-tab.active { background:var(--s3); color:var(--tx); }
      .res-tab:hover:not(.active) { color:var(--p300); }

      /* Tab panels */
      .res-panel { display:none; }
      .res-panel.active { display:block; }

      /* Text tab */
      #res-text-input {
        width:100%; height:68px; resize:none;
        background:var(--s1); border:1px solid var(--bd);
        border-radius:var(--r); color:var(--tx); font-family:var(--font);
        font-size:12px; padding:8px 10px; outline:none; line-height:1.5;
        transition:border-color var(--tx-dur), box-shadow var(--tx-dur);
      }
      #res-text-input:focus {
        border-color:var(--p500); box-shadow:0 0 0 3px rgba(139,92,246,.18);
      }
      #res-text-input::placeholder { color:var(--txd); }
      #add-text-btn {
        margin-top:7px; width:100%;
        padding:7px 0; background:transparent;
        border:1px solid var(--bd); border-radius:var(--r);
        color:var(--p400); font-family:var(--font); font-size:12px;
        font-weight:600; cursor:pointer; transition:background var(--tx-dur);
      }
      #add-text-btn:hover { background:var(--s2); }

      /* File tab */
      .file-drop-zone {
        border:1.5px dashed var(--bd); border-radius:var(--r);
        padding:14px 10px; text-align:center; cursor:pointer;
        transition:border-color var(--tx-dur), background var(--tx-dur);
        position:relative;
      }
      .file-drop-zone:hover, .file-drop-zone.drag-over {
        border-color:var(--p500); background:rgba(139,92,246,.07);
      }
      .file-drop-zone input[type="file"] {
        position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
      }
      .file-drop-zone svg { display:block; margin:0 auto 6px; color:var(--p400); }
      .file-drop-zone p { font-size:11px; color:var(--txm); line-height:1.5; }
      .file-drop-zone em { font-style:normal; color:var(--txd); font-size:10px; }
      #file-status { margin-top:7px; font-size:11px; color:var(--txm); min-height:16px; }
      #file-status.ok  { color:#86efac; }
      #file-status.err { color:#fca5a5; }
      #file-status.loading { color:var(--p300); }

      /* URL tab */
      .url-row { display:flex; gap:6px; }
      #res-url-input {
        flex:1; padding:8px 10px;
        background:var(--s1); border:1px solid var(--bd);
        border-radius:var(--r); color:var(--tx); font-family:var(--font);
        font-size:12px; outline:none;
        transition:border-color var(--tx-dur), box-shadow var(--tx-dur);
      }
      #res-url-input:focus {
        border-color:var(--p500); box-shadow:0 0 0 3px rgba(139,92,246,.18);
      }
      #res-url-input::placeholder { color:var(--txd); }
      #add-url-btn {
        padding:8px 12px; background:linear-gradient(135deg,var(--p700),var(--p600));
        color:#fff; border:none; border-radius:var(--r);
        font-family:var(--font); font-size:12px; font-weight:600;
        cursor:pointer; white-space:nowrap;
        transition:opacity var(--tx-dur);
      }
      #add-url-btn:hover { opacity:.85; }
      #add-url-btn:disabled { opacity:.4; cursor:not-allowed; }
      #url-status { margin-top:7px; font-size:11px; color:var(--txm); min-height:16px; display:flex; align-items:center; gap:6px; }
      #url-status.ok  { color:#86efac; }
      #url-status.err { color:#fca5a5; }

      /* Resource list */
      #resource-list { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
      .resource-item {
        display:flex; align-items:center; gap:8px;
        background:var(--s1); border:1px solid var(--bd);
        border-radius:var(--r); padding:7px 10px;
      }
      .resource-item-icon {
        width:22px; height:22px; border-radius:5px; flex-shrink:0;
        display:flex; align-items:center; justify-content:center;
        font-size:11px; font-weight:700;
      }
      .ri-text { background:rgba(139,92,246,.2); color:var(--p300); }
      .ri-file { background:rgba(249,115,22,.2);  color:var(--o400); }
      .ri-url  { background:rgba(34,197,94,.18);  color:#86efac; }
      .resource-item-label {
        flex:1; font-size:11px; color:var(--txm);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      }
      .resource-remove-btn {
        background:none; border:none; color:var(--txd); cursor:pointer;
        padding:2px 4px; border-radius:4px; font-size:13px; line-height:1;
        flex-shrink:0; transition:color var(--tx-dur), background var(--tx-dur);
      }
      .resource-remove-btn:hover { color:#fca5a5; background:rgba(239,68,68,.12); }

      /* ── Clear button ──────────────────────────────────────────────── */
      #clear-btn {
        display:none; margin-top:8px; width:100%;
        padding:7px 0; background:transparent;
        border:1px solid var(--bd); border-radius:var(--r);
        color:var(--p400); font-family:var(--font); font-size:12px;
        cursor:pointer; transition:background var(--tx-dur);
      }
      #clear-btn:hover { background:var(--s2); }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="logo-wrap">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h9M3 9h6M3 13h8" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="15" cy="13" r="4" fill="none" stroke="#f97316" stroke-width="1.5"/>
          <path d="M13.5 13l1 1 2-2" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="header-text"><h1>QuizFill</h1><p>AI-powered form filler</p></div>
      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Main content -->
    <div class="content">

      <!-- No API key -->
      <div id="no-key-banner">
        ⚠️ No API key configured.
        <a id="setup-link">Set up your LLM provider →</a>
      </div>

      <!-- Fill button -->
      <button id="fill-btn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        Fill This Page
      </button>

      <!-- Filling state -->
      <div id="status-area">
        <div class="spinner"></div>
        <span id="status-text">Scanning page for questions…</span>
      </div>

      <!-- Results -->
      <div id="results-area">
        <div class="results-card">
          <div class="results-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
            Fill Complete
          </div>
          <div class="conf-row">
            <div class="conf-cell conf-high"><div class="num" id="high-count">0</div><div class="lbl">High</div></div>
            <div class="conf-cell conf-med"> <div class="num" id="med-count">0</div> <div class="lbl">Medium</div></div>
            <div class="conf-cell conf-low"> <div class="num" id="low-count">0</div>  <div class="lbl">Low</div></div>
          </div>
          <div class="results-footer"><span id="total-count">0</span> fields filled</div>
        </div>
        <button id="clear-btn">✕ Clear Resources &amp; Reset</button>
      </div>

      <!-- Error -->
      <div id="error-area"></div>

      <!-- Divider + Resources section -->
      <div class="divider"></div>
      <div id="resources-section">
        <div class="res-header">
          <div class="section-label">Resources <span>(optional)</span></div>
          <span id="res-count-badge" style="font-size:10px;color:var(--txd);"></span>
        </div>

        <!-- Tab bar -->
        <div class="res-tabs">
          <button class="res-tab active" data-tab="text">📝 Text</button>
          <button class="res-tab"        data-tab="file">📄 File</button>
          <button class="res-tab"        data-tab="url" >🔗 URL</button>
        </div>

        <!-- Text panel -->
        <div class="res-panel active" id="panel-text">
          <textarea id="res-text-input" placeholder="Paste study notes, a cheat sheet, or any reference text…"></textarea>
          <button id="add-text-btn">+ Add Text</button>
        </div>

        <!-- File panel -->
        <div class="res-panel" id="panel-file">
          <div class="file-drop-zone" id="file-drop-zone">
            <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md,.csv" multiple />
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <p>Drop files here or <strong style="color:var(--p400)">click to browse</strong></p>
            <em>PDF, DOCX, TXT, MD, CSV</em>
          </div>
          <div id="file-status"></div>
        </div>

        <!-- URL panel -->
        <div class="res-panel" id="panel-url">
          <div class="url-row">
            <input type="url" id="res-url-input" placeholder="https://example.com/notes" />
            <button id="add-url-btn">Fetch</button>
          </div>
          <div id="url-status"></div>
        </div>

        <!-- Resource list (shown across all tabs) -->
        <div id="resource-list"></div>
      </div>

    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
