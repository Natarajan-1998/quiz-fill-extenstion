<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizFill</title>
    <style>
      /* ── Import shared design tokens ────────────────────────────────── */
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

      :root {
        --kiro-purple-900: #2e1065;
        --kiro-purple-800: #3b0764;
        --kiro-purple-700: #6b21a8;
        --kiro-purple-600: #7c3aed;
        --kiro-purple-500: #8b5cf6;
        --kiro-purple-400: #a78bfa;
        --kiro-purple-300: #c4b5fd;
        --kiro-orange-500: #f97316;
        --kiro-orange-400: #fb923c;
        --kiro-orange-200: #fed7aa;
        --kiro-bg:         #0f0a1a;
        --kiro-surface-1:  #1a1030;
        --kiro-surface-2:  #251843;
        --kiro-surface-3:  #2f2060;
        --kiro-border:     #3d2b7a;
        --kiro-border-dim: #2a1f55;
        --kiro-text:       #f1eeff;
        --kiro-text-muted: #a89ec4;
        --kiro-text-dim:   #6b5f8a;
        --kiro-success:    #22c55e;
        --kiro-warn:       #f59e0b;
        --kiro-error:      #ef4444;
        --kiro-font: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        --kiro-radius:    8px;
        --kiro-radius-lg: 12px;
        --tx: 0.15s ease;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 360px;
        min-height: 200px;
        font-family: var(--kiro-font);
        font-size: 14px;
        color: var(--kiro-text);
        background: var(--kiro-bg);
        -webkit-font-smoothing: antialiased;
      }

      /* ── Header ─────────────────────────────────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 14px 11px;
        background: linear-gradient(135deg, #3b0764, #6b21a8);
        /* Orange accent line at top */
        border-top: 3px solid var(--kiro-orange-500);
      }

      .logo-wrap {
        width: 32px; height: 32px;
        background: rgba(255,255,255,0.08);
        border-radius: 8px;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
      }

      .header-text h1 {
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.2px;
      }
      .header-text p {
        font-size: 11px;
        color: rgba(255,255,255,0.6);
        margin-top: 1px;
      }

      .header-actions { margin-left: auto; display: flex; gap: 6px; }

      .icon-btn {
        background: rgba(255,255,255,0.1);
        border: none;
        border-radius: 6px;
        color: rgba(255,255,255,0.8);
        cursor: pointer;
        padding: 5px 7px;
        display: flex; align-items: center;
        transition: background var(--tx);
      }
      .icon-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

      /* ── Content ─────────────────────────────────────────────────────── */
      .content { padding: 14px 14px 16px; }

      /* ── No-key banner ───────────────────────────────────────────────── */
      #no-key-banner {
        display: none;
        background: rgba(249,115,22,0.1);
        border: 1px solid rgba(249,115,22,0.35);
        border-radius: var(--kiro-radius);
        padding: 10px 12px;
        margin-bottom: 12px;
        font-size: 12px;
        color: #fed7aa;
        line-height: 1.5;
      }
      #no-key-banner a {
        color: var(--kiro-orange-400);
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
      }

      /* ── Fill button ─────────────────────────────────────────────────── */
      #fill-btn {
        width: 100%;
        padding: 11px 0;
        background: linear-gradient(135deg, var(--kiro-purple-700), var(--kiro-purple-600));
        color: #fff;
        border: none;
        border-radius: var(--kiro-radius);
        font-family: var(--kiro-font);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        gap: 7px;
        box-shadow: 0 2px 12px rgba(107,33,168,0.5);
        transition: opacity var(--tx), transform var(--tx), box-shadow var(--tx);
      }
      #fill-btn:hover:not(:disabled) {
        opacity: 0.88;
        box-shadow: 0 4px 18px rgba(107,33,168,0.65);
      }
      #fill-btn:active:not(:disabled) { transform: scale(0.97); }
      #fill-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

      /* ── Status / spinner ────────────────────────────────────────────── */
      #status-area {
        display: none;
        align-items: center;
        gap: 9px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--kiro-purple-300);
      }
      .spinner {
        width: 16px; height: 16px;
        border: 2px solid var(--kiro-surface-3);
        border-top-color: var(--kiro-purple-500);
        border-radius: 50%;
        animation: spin 0.65s linear infinite;
        flex-shrink: 0;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ── Results card ────────────────────────────────────────────────── */
      #results-area { display: none; margin-top: 12px; }

      .results-card {
        background: var(--kiro-surface-1);
        border: 1px solid var(--kiro-border);
        border-radius: var(--kiro-radius-lg);
        overflow: hidden;
      }
      .results-title {
        display: flex; align-items: center; gap: 7px;
        padding: 10px 14px 8px;
        border-bottom: 1px solid var(--kiro-border-dim);
        font-size: 12px;
        font-weight: 600;
        color: var(--kiro-purple-300);
      }
      .results-title svg { color: var(--kiro-success); }

      .conf-row {
        display: flex;
        padding: 10px 14px;
        gap: 8px;
      }
      .conf-cell {
        flex: 1;
        background: var(--kiro-surface-2);
        border-radius: 6px;
        padding: 8px 6px;
        text-align: center;
      }
      .conf-cell .num {
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 3px;
      }
      .conf-cell .lbl {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.75;
      }
      .conf-high .num  { color: #86efac; }
      .conf-high .lbl  { color: #86efac; }
      .conf-med  .num  { color: #fcd34d; }
      .conf-med  .lbl  { color: #fcd34d; }
      .conf-low  .num  { color: #fca5a5; }
      .conf-low  .lbl  { color: #fca5a5; }

      .results-footer {
        padding: 7px 14px 10px;
        font-size: 11px;
        color: var(--kiro-text-dim);
        text-align: right;
      }

      /* ── Error area ──────────────────────────────────────────────────── */
      #error-area {
        display: none;
        margin-top: 10px;
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.3);
        border-radius: var(--kiro-radius);
        padding: 10px 12px;
        font-size: 12px;
        color: #fca5a5;
        line-height: 1.5;
      }

      /* ── Divider ─────────────────────────────────────────────────────── */
      .divider {
        height: 1px;
        background: var(--kiro-border-dim);
        margin: 13px 0;
      }

      /* ── Resources placeholder ───────────────────────────────────────── */
      #resources-section .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--kiro-purple-400);
        margin-bottom: 8px;
      }
      .resource-placeholder {
        font-size: 12px;
        color: var(--kiro-text-dim);
        line-height: 1.5;
      }
      .resource-placeholder em { color: var(--kiro-orange-400); font-style: normal; }

      /* ── Clear button ────────────────────────────────────────────────── */
      #clear-btn {
        display: none;
        margin-top: 8px;
        width: 100%;
        padding: 7px 0;
        background: transparent;
        border: 1px solid var(--kiro-border);
        border-radius: var(--kiro-radius);
        color: var(--kiro-purple-400);
        font-family: var(--kiro-font);
        font-size: 12px;
        cursor: pointer;
        transition: background var(--tx);
      }
      #clear-btn:hover { background: var(--kiro-surface-2); }
    </style>
  </head>
  <body>
    <!-- ── Header ─────────────────────────────────────── -->
    <div class="header">
      <div class="logo-wrap">
        <!-- QuizFill logo: list lines + checkmark circle -->
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M3 5h9M3 9h6M3 13h8" stroke="#c4b5fd" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="15" cy="13" r="4" fill="none" stroke="#f97316" stroke-width="1.5"/>
          <path d="M13.5 13l1 1 2-2" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="header-text">
        <h1>QuizFill</h1>
        <p>AI-powered form filler</p>
      </div>

      <div class="header-actions">
        <button class="icon-btn" id="settings-btn" title="Settings">
          <!-- gear icon -->
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── Main content ────────────────────────────────── -->
    <div class="content">

      <!-- No API key configured -->
      <div id="no-key-banner">
        ⚠️ No API key configured.
        <a id="setup-link">Set up your LLM provider →</a>
      </div>

      <!-- Primary CTA -->
      <button id="fill-btn" disabled>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        Fill This Page
      </button>

      <!-- Filling state -->
      <div id="status-area">
        <div class="spinner"></div>
        <span id="status-text">Scanning page for questions…</span>
      </div>

      <!-- Results -->
      <div id="results-area">
        <div class="results-card">
          <div class="results-title">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
            Fill Complete
          </div>
          <div class="conf-row">
            <div class="conf-cell conf-high">
              <div class="num" id="high-count">0</div>
              <div class="lbl">High</div>
            </div>
            <div class="conf-cell conf-med">
              <div class="num" id="med-count">0</div>
              <div class="lbl">Medium</div>
            </div>
            <div class="conf-cell conf-low">
              <div class="num" id="low-count">0</div>
              <div class="lbl">Low</div>
            </div>
          </div>
          <div class="results-footer">
            <span id="total-count">0</span> fields filled
          </div>
        </div>
        <button id="clear-btn">✕ Clear Resources &amp; Reset</button>
      </div>

      <!-- Error -->
      <div id="error-area"></div>

      <!-- Divider + Resources placeholder -->
      <div class="divider"></div>
      <div id="resources-section">
        <div class="section-label">Resources <span style="color:var(--kiro-orange-400)">(optional)</span></div>
        <p class="resource-placeholder">
          Add study notes, files, or URLs to help the AI answer more accurately.
          <br/><em>Resource inputs available in Task 6.</em>
        </p>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
